<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>دِثار | DITHAR</title>
    <!-- Starts the logo fetch from the initial HTML response, in parallel
         with the JS bundle loading — the default theme is "men" and the
         default language is "ar", so that's the one that needs to be
         ready the instant React mounts. -->
          <link rel="preload" as="image" href="./logos/dithar_male_ar.png" fetchpriority="high" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Bridges the native launch screen and the first React paint with the
         launch intro's colour (DITHAR's page colour), so nothing white (or the
         Home Screen) flashes in between. The intro (StartupHadithOverlay.tsx) removes it. Plain
         inline CSS/JS: it must paint before any bundle has loaded. -->
    <div id="dithar-launch-cover" style="position: fixed; inset: 0; z-index: 2147483647; background: #f2e9da"></div>
    <script>
      (function () {
        // --color-bg of the men/women identity (index.css); the native launch screen uses the men's.
        var bg = "#f2e9da";
        try {
          if (localStorage.getItem("dithar:appearance:theme:v1") === "women") bg = "#f6f2e9";
        } catch (e) {}
        document.getElementById("dithar-launch-cover").style.background = bg;
        document.documentElement.style.setProperty("--launch-bg", bg);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
